<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor - Access Requests</title>

    <!-- SAME ADMIN DASHBOARD THEME -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../admin.css">

    <style>
        .page-title {
            margin-bottom: 20px;
        }

        .request-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            border: none;
            padding: 10px 17px;
            border-radius: 6px;
            background: #e8f1f4;
            color: #0b6684;
            cursor: pointer;
            font-size: 14px;
        }

        .tab-btn.active {
            background: #0b6684;
            color: white;
        }

        .request-card {
            border: 1px solid #e0e6e8;
            border-radius: 9px;
            padding: 18px;
            margin-bottom: 16px;
            background: #fafcfd;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .request-header h3 {
            margin: 0 0 5px;
            color: #0b6684;
        }

        .request-id {
            color: #777;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff4d6;
            color: #856404;
        }

        .status-accepted {
            background: #e9f7ef;
            color: #207044;
        }

        .status-rejected {
            background: #fdecec;
            color: #a22a2a;
        }

        .request-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
        }

        .detail-item {
            padding: 11px;
            background: white;
            border: 1px solid #e5e9eb;
            border-radius: 7px;
        }

        .detail-label {
            display: block;
            color: #777;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .detail-value {
            display: block;
            word-break: break-word;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .accept-btn,
        .reject-btn,
        .view-btn,
        .request-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .accept-btn {
            background: #0b6684;
            color: white;
        }

        .reject-btn {
            background: #f4dddd;
            color: #9d2c2c;
        }

        .view-btn {
            background: #e8f1f4;
            color: #0b6684;
        }

        .request-btn {
            background: #0b6684;
            color: white;
        }

        .accept-btn:hover,
        .reject-btn:hover,
        .view-btn:hover,
        .request-btn:hover {
            opacity: 0.9;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: 14px;
        }

        .success-message {
            background: #e9f7ef;
            color: #207044;
        }

        .error-message {
            background: #fdecec;
            color: #a22a2a;
        }

        .info-message {
            background: #eef6f9;
            color: #0b6684;
        }

        .empty-card {
            text-align: center;
            padding: 35px 20px;
            color: #777;
        }

        .notification-box {
            padding: 12px 14px;
            background: #eef6f9;
            border-left: 4px solid #0b6684;
            border-radius: 4px;
            margin-bottom: 18px;
            color: #0b6684;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ccd5d9;
            border-radius: 7px;
            font-family: inherit;
            margin-bottom: 18px;
        }

        .search-box:focus {
            outline: none;
            border-color: #0b6684;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .request-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- TOPBAR -->
<header class="topbar">

    <div class="logo">
        Hospital Management System
    </div>

    <div class="topbar-right">

        <span id="doctorTopName">
            Doctor
        </span>

        <a
            href="../index.html"
            onclick="logoutDoctor()"
        >
            Logout
        </a>

    </div>

</header>


<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h3>Doctor Panel</h3>

        <a href="doctor-dashboard.html">
            Dashboard
        </a>

        <a href="doctor-patients.html">
            My Patients
        </a>

        <a href="doctor-appointments.html">
            Appointments
        </a>

        <a href="doctor-records.html">
            Records
        </a>

        <a href="doctor-prescriptions.html">
            Prescriptions
        </a>

        <a href="doctor-access-requests.html">
            Access Requests
        </a>

        <a href="doctor-profile.html">
            My Profile
        </a>

    </aside>


    <!-- CONTENT -->
    <main class="content">

        <div class="card page-title">

            <h2>
                Doctor Access Requests
            </h2>

            <p>
                Manage requests from other doctors to access your patients' medical records.
            </p>

        </div>


        <!-- INFORMATION -->
        <div
            id="notificationBox"
            class="notification-box hidden"
        >
        </div>


        <!-- TABS -->
        <div class="request-tabs">

            <button
                type="button"
                id="incomingTab"
                class="tab-btn active"
                onclick="switchTab('incoming')"
            >
                Incoming Requests
            </button>

            <button
                type="button"
                id="outgoingTab"
                class="tab-btn"
                onclick="switchTab('outgoing')"
            >
                My Requests
            </button>

        </div>


        <!-- SEARCH -->
        <div class="card">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="Search by patient ID, patient name or doctor..."
                oninput="renderRequests()"
            >

        </div>


        <!-- INCOMING REQUESTS -->
        <div id="incomingSection">

            <div
                id="incomingRequests"
            >
            </div>

        </div>


        <!-- OUTGOING REQUESTS -->
        <div
            id="outgoingSection"
            class="hidden"
        >

            <div
                id="outgoingRequests"
            >
            </div>

        </div>


        <!-- MESSAGE -->
        <div
            id="pageMessage"
            class="message"
        >
        </div>

    </main>

</div>


<!-- FOOTER -->
<footer>

    <p>
        © Hospital Management System
    </p>

</footer>


<script src="../security.js"></script>


<script>

    /* =========================================================
       DOCTOR SESSION
       ========================================================= */

    function getLoggedInDoctor() {

        const possibleKeys = [
            "loggedInDoctor",
            "doctorSession",
            "currentDoctor"
        ];


        for (
            const key of possibleKeys
        ) {

            const raw =
                localStorage.getItem(
                    key
                );


            if (!raw) {
                continue;
            }


            try {

                const parsed =
                    JSON.parse(raw);


                if (
                    parsed &&
                    typeof parsed === "object"
                ) {

                    return parsed;

                }

            } catch (error) {

                return {
                    username: raw,
                    name: raw
                };

            }

        }


        const hmsSession =
            localStorage.getItem(
                "hmsSession"
            );


        if (hmsSession) {

            try {

                const session =
                    JSON.parse(
                        hmsSession
                    );


                if (
                    session &&
                    (
                        normalize(session.role) === "doctor" ||
                        normalize(session.userType) === "doctor" ||
                        normalize(session.userRole) === "doctor"
                    )
                ) {

                    return session;

                }

            } catch (error) {
                // Ignore invalid session.
            }

        }


        return null;

    }


    const currentDoctor =
        getLoggedInDoctor();


    function getDoctorId(
        doctor
    ) {

        if (!doctor) {
            return "";
        }


        return String(
            doctor.doctorId ||
            doctor.id ||
            doctor.userId ||
            doctor.username ||
            ""
        ).trim();

    }


    function getDoctorName(
        doctor
    ) {

        if (!doctor) {
            return "Doctor";
        }


        return String(
            doctor.name ||
            doctor.fullName ||
            doctor.doctorName ||
            doctor.username ||
            "Doctor"
        ).trim();

    }


    const currentDoctorId =
        getDoctorId(
            currentDoctor
        );


    const currentDoctorName =
        getDoctorName(
            currentDoctor
        );


    document.getElementById(
        "doctorTopName"
    ).textContent =
        currentDoctorName;


    /* =========================================================
       HELPERS
       ========================================================= */

    function normalize(
        value
    ) {

        return String(
            value || ""
        )
        .trim()
        .toLowerCase();

    }


    function getArray(
        key
    ) {

        try {

            const value =
                JSON.parse(
                    localStorage.getItem(
                        key
                    ) || "[]"
                );


            return Array.isArray(
                value
            )
                ? value
                : [];

        } catch (error) {

            return [];

        }

    }


    function saveArray(
        key,
        value
    ) {

        localStorage.setItem(
            key,
            JSON.stringify(
                value
            )
        );

    }


    function escapeHTML(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "-";

        }


        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function getPatientId(
        patient
    ) {

        if (!patient) {
            return "";
        }


        return String(
            patient.patientId ||
            patient.id ||
            patient.patientID ||
            ""
        ).trim();

    }


    function getPatientName(
        patient
    ) {

        if (!patient) {
            return "";
        }


        return String(
            patient.fullName ||
            patient.name ||
            patient.patientName ||
            patient.username ||
            ""
        ).trim();

    }


    function todayDate() {

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }


    function formatDateTime(
        value
    ) {

        if (!value) {
            return "-";
        }


        try {

            return new Date(
                value
            ).toLocaleString();

        } catch (error) {

            return String(
                value
            );

        }

    }


    /* =========================================================
       CURRENT TAB
       ========================================================= */

    let currentTab =
        "incoming";


    function switchTab(
        tab
    ) {

        currentTab =
            tab;


        const incomingTab =
            document.getElementById(
                "incomingTab"
            );


        const outgoingTab =
            document.getElementById(
                "outgoingTab"
            );


        const incomingSection =
            document.getElementById(
                "incomingSection"
            );


        const outgoingSection =
            document.getElementById(
                "outgoingSection"
            );


        if (
            tab === "incoming"
        ) {

            incomingTab.classList.add(
                "active"
            );

            outgoingTab.classList.remove(
                "active"
            );


            incomingSection.classList.remove(
                "hidden"
            );

            outgoingSection.classList.add(
                "hidden"
            );

        } else {

            outgoingTab.classList.add(
                "active"
            );

            incomingTab.classList.remove(
                "active"
            );


            outgoingSection.classList.remove(
                "hidden"
            );

            incomingSection.classList.add(
                "hidden"
            );

        }


        document.getElementById(
            "searchInput"
        ).value =
            "";


        renderRequests();

    }


    /* =========================================================
       GET REQUESTS
       ========================================================= */

    function getRequests() {

        return getArray(
            "doctorAccessRequests"
        );

    }


    /* =========================================================
       INCOMING REQUEST
       ========================================================= */

    function isIncomingRequest(
        request
    ) {

        if (
            !request ||
            !currentDoctor
        ) {

            return false;

        }


        const ownerId =
            request.ownerDoctorId ||
            request.ownerId;


        const ownerName =
            request.ownerDoctorName ||
            request.ownerName;


        const ownerMatches =
            (
                ownerId &&
                currentDoctorId &&
                normalize(
                    ownerId
                ) === normalize(
                    currentDoctorId
                )
            )
            ||
            (
                ownerName &&
                currentDoctorName &&
                normalize(
                    ownerName
                ) === normalize(
                    currentDoctorName
                )
            );


        return ownerMatches;

    }


    /* =========================================================
       OUTGOING REQUEST
       ========================================================= */

    function isOutgoingRequest(
        request
    ) {

        if (
            !request ||
            !currentDoctor
        ) {

            return false;

        }


        const requesterId =
            request.requesterDoctorId ||
            request.requesterId ||
            request.doctorId;


        const requesterName =
            request.requesterDoctorName ||
            request.requesterName;


        const requesterMatches =
            (
                requesterId &&
                currentDoctorId &&
                normalize(
                    requesterId
                ) === normalize(
                    currentDoctorId
                )
            )
            ||
            (
                requesterName &&
                currentDoctorName &&
                normalize(
                    requesterName
                ) === normalize(
                    currentDoctorName
                )
            );


        return requesterMatches;

    }


    /* =========================================================
       SEARCH
       ========================================================= */

    function requestMatchesSearch(
        request,
        search
    ) {

        if (!search) {
            return true;
        }


        const values = [

            request.patientId,

            request.patientName,

            request.requesterDoctorId,

            request.requesterDoctorName,

            request.ownerDoctorId,

            request.ownerDoctorName,

            request.status

        ];


        return values.some(
            function(value) {

                return normalize(
                    value
                ).includes(
                    normalize(
                        search
                    )
                );

            }
        );

    }


    /* =========================================================
       STATUS CLASS
       ========================================================= */

    function getStatusClass(
        status
    ) {

        const normalized =
            normalize(
                status
            );


        if (
            normalized === "accepted"
        ) {

            return "status-accepted";

        }


        if (
            normalized === "rejected"
        ) {

            return "status-rejected";

        }


        return "status-pending";

    }


    /* =========================================================
       RENDER ALL
       ========================================================= */

    function renderRequests() {

        if (!currentDoctor) {

            document.getElementById(
                "incomingRequests"
            ).innerHTML = `

                <div class="card empty-card">

                    <h3>
                        Doctor Login Required
                    </h3>

                    <p>
                        Please log in as a doctor to manage access requests.
                    </p>

                </div>

            `;


            document.getElementById(
                "outgoingRequests"
            ).innerHTML = "";


            return;

        }


        const search =
            document.getElementById(
                "searchInput"
            ).value;


        const requests =
            getRequests();


        renderIncoming(
            requests,
            search
        );


        renderOutgoing(
            requests,
            search
        );


        updateNotification();

    }


    /* =========================================================
       RENDER INCOMING
       ========================================================= */

    function renderIncoming(
        requests,
        search
    ) {

        const container =
            document.getElementById(
                "incomingRequests"
            );


        const incoming =
            requests
                .filter(
                    function(request) {

                        return (
                            isIncomingRequest(
                                request
                            ) &&
                            requestMatchesSearch(
                                request,
                                search
                            )
                        );

                    }
                )
                .sort(
                    function(a, b) {

                        return new Date(
                            b.requestedAt ||
                            b.requestDate ||
                            0
                        ) -
                        new Date(
                            a.requestedAt ||
                            a.requestDate ||
                            0
                        );

                    }
                );


        if (!incoming.length) {

            container.innerHTML = `

                <div class="card empty-card">

                    <h3>
                        No Incoming Requests
                    </h3>

                    <p>
                        No doctors are currently requesting access to your patients.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            incoming.map(
                function(request) {

                    return createIncomingCard(
                        request
                    );

                }
            ).join("");

    }


    /* =========================================================
       RENDER OUTGOING
       ========================================================= */

    function renderOutgoing(
        requests,
        search
    ) {

        const container =
            document.getElementById(
                "outgoingRequests"
            );


        const outgoing =
            requests
                .filter(
                    function(request) {

                        return (
                            isOutgoingRequest(
                                request
                            ) &&
                            requestMatchesSearch(
                                request,
                                search
                            )
                        );

                    }
                )
                .sort(
                    function(a, b) {

                        return new Date(
                            b.requestedAt ||
                            b.requestDate ||
                            0
                        ) -
                        new Date(
                            a.requestedAt ||
                            a.requestDate ||
                            0
                        );

                    }
                );


        if (!outgoing.length) {

            container.innerHTML = `

                <div class="card empty-card">

                    <h3>
                        No Requests
                    </h3>

                    <p>
                        You have not sent any patient access requests.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            outgoing.map(
                function(request) {

                    return createOutgoingCard(
                        request
                    );

                }
            ).join("");

    }


    /* =========================================================
       INCOMING CARD
       ========================================================= */

    function createIncomingCard(
        request
    ) {

        const status =
            request.status ||
            "Pending";


        const normalizedStatus =
            normalize(
                status
            );


        const requesterName =
            request.requesterDoctorName ||
            request.requesterName ||
            request.requesterDoctorId ||
            request.requesterId ||
            "Doctor";


        const requesterId =
            request.requesterDoctorId ||
            request.requesterId ||
            request.doctorId ||
            "-";


        const patientId =
            request.patientId ||
            request.patientID ||
            "-";


        const patientName =
            request.patientName ||
            "-";


        const requestDate =
            request.requestDate ||
            "-";


        let actionHTML =
            "";


        if (
            normalizedStatus === "pending"
        ) {

            actionHTML = `

                <div class="button-row">

                    <button
                        type="button"
                        class="accept-btn"
                        onclick="acceptRequest('${escapeAttribute(
                            request.id
                        )}')"
                    >
                        ✓ Accept
                    </button>

                    <button
                        type="button"
                        class="reject-btn"
                        onclick="rejectRequest('${escapeAttribute(
                            request.id
                        )}')"
                    >
                        ✕ Reject
                    </button>

                    <a
                        href="doctor-patient-record.html?patientId=${encodeURIComponent(
                            patientId
                        )}"
                        class="view-btn"
                    >
                        View Patient
                    </a>

                </div>

            `;

        } else if (
            normalizedStatus === "accepted"
        ) {

            actionHTML = `

                <div class="button-row">

                    <a
                        href="doctor-patient-record.html?patientId=${encodeURIComponent(
                            patientId
                        )}"
                        class="view-btn"
                    >
                        View Patient Record
                    </a>

                </div>

            `;

        }


        return `

            <div class="request-card">

                <div class="request-header">

                    <div>

                        <h3>
                            Access Request
                        </h3>

                        <div class="request-id">

                            Request ID:
                            ${escapeHTML(
                                request.id ||
                                "-"
                            )}

                        </div>

                    </div>


                    <span class="status-badge ${getStatusClass(
                        status
                    )}">

                        ${escapeHTML(
                            status
                        )}

                    </span>

                </div>


                <div class="request-details">

                    <div class="detail-item">

                        <span class="detail-label">
                            Requesting Doctor
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                requesterName
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Requester Doctor ID
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                requesterId
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Patient ID
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                patientId
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Patient Name
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                patientName
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Request Date
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                requestDate
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Decision Date
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                request.decisionDate ||
                                "-"
                            )}

                        </span>

                    </div>

                </div>


                ${actionHTML}

            </div>

        `;

    }


    /* =========================================================
       OUTGOING CARD
       ========================================================= */

    function createOutgoingCard(
        request
    ) {

        const status =
            request.status ||
            "Pending";


        const ownerName =
            request.ownerDoctorName ||
            request.ownerName ||
            request.ownerDoctorId ||
            request.ownerId ||
            "Doctor";


        const ownerId =
            request.ownerDoctorId ||
            request.ownerId ||
            "-";


        const patientId =
            request.patientId ||
            request.patientID ||
            "-";


        const patientName =
            request.patientName ||
            "-";


        let actionHTML =
            "";


        if (
            normalize(status) ===
            "accepted"
        ) {

            actionHTML = `

                <div class="button-row">

                    <a
                        href="doctor-patient-record.html?patientId=${encodeURIComponent(
                            patientId
                        )}"
                        class="view-btn"
                    >
                        View Patient Record
                    </a>

                </div>

            `;

        }


        return `

            <div class="request-card">

                <div class="request-header">

                    <div>

                        <h3>
                            Patient Access Request
                        </h3>

                        <div class="request-id">

                            Request ID:
                            ${escapeHTML(
                                request.id ||
                                "-"
                            )}

                        </div>

                    </div>


                    <span class="status-badge ${getStatusClass(
                        status
                    )}">

                        ${escapeHTML(
                            status
                        )}

                    </span>

                </div>


                <div class="request-details">

                    <div class="detail-item">

                        <span class="detail-label">
                            Patient ID
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                patientId
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Patient Name
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                patientName
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Assigned Doctor
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                ownerName
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Assigned Doctor ID
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                ownerId
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Request Date
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                request.requestDate ||
                                "-"
                            )}

                        </span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Decision Date
                        </span>

                        <span class="detail-value">

                            ${escapeHTML(
                                request.decisionDate ||
                                "-"
                            )}

                        </span>

                    </div>

                </div>


                ${actionHTML}

            </div>

        `;

    }


    /* =========================================================
       ACCEPT REQUEST
       ========================================================= */

    function acceptRequest(
        requestId
    ) {

        const requests =
            getRequests();


        const index =
            requests.findIndex(
                function(request) {

                    return String(
                        request.id
                    ) === String(
                        requestId
                    );

                }
            );


        if (index === -1) {

            showMessage(
                "pageMessage",
                "Access request could not be found.",
                "error-message"
            );

            return;

        }


        const request =
            requests[index];


        /*
         * Security check:
         * only the patient owner can accept.
         */

        if (
            !isIncomingRequest(
                request
            )
        ) {

            showMessage(
                "pageMessage",
                "You are not authorized to approve this request.",
                "error-message"
            );

            return;

        }


        if (
            normalize(
                request.status
            ) !== "pending"
        ) {

            showMessage(
                "pageMessage",
                "This request has already been processed.",
                "info-message"
            );

            return;

        }


        const now =
            new Date();


        request.status =
            "Accepted";


        request.decisionDate =
            todayDate();


        request.decisionAt =
            now.toISOString();


        request.decisionBy =
            currentDoctorId;


        request.decisionByName =
            currentDoctorName;


        requests[index] =
            request;


        saveArray(
            "doctorAccessRequests",
            requests
        );


        /*
         * Notify the requesting doctor.
         */

        createAccessNotification(
            request,
            "accepted"
        );


        showMessage(
            "pageMessage",
            "Access request accepted. The requesting doctor can now view this patient's medical record.",
            "success-message"
        );


        renderRequests();

    }


    /* =========================================================
       REJECT REQUEST
       ========================================================= */

    function rejectRequest(
        requestId
    ) {

        const requests =
            getRequests();


        const index =
            requests.findIndex(
                function(request) {

                    return String(
                        request.id
                    ) === String(
                        requestId
                    );

                }
            );


        if (index === -1) {

            showMessage(
                "pageMessage",
                "Access request could not be found.",
                "error-message"
            );

            return;

        }


        const request =
            requests[index];


        /*
         * Security check:
         * only the patient owner can reject.
         */

        if (
            !isIncomingRequest(
                request
            )
        ) {

            showMessage(
                "pageMessage",
                "You are not authorized to reject this request.",
                "error-message"
            );

            return;

        }


        if (
            normalize(
                request.status
            ) !== "pending"
        ) {

            showMessage(
                "pageMessage",
                "This request has already been processed.",
                "info-message"
            );

            return;

        }


        const now =
            new Date();


        request.status =
            "Rejected";


        request.decisionDate =
            todayDate();


        request.decisionAt =
            now.toISOString();


        request.decisionBy =
            currentDoctorId;


        request.decisionByName =
            currentDoctorName;


        requests[index] =
            request;


        saveArray(
            "doctorAccessRequests",
            requests
        );


        /*
         * Notify the requesting doctor.
         */

        createAccessNotification(
            request,
            "rejected"
        );


        showMessage(
            "pageMessage",
            "Access request rejected.",
            "success-message"
        );


        renderRequests();

    }


    /* =========================================================
       NOTIFICATION
       ========================================================= */

    function createAccessNotification(
        request,
        decision
    ) {

        const notifications =
            getArray(
                "notifications"
            );


        const requesterId =
            request.requesterDoctorId ||
            request.requesterId ||
            request.doctorId ||
            "";


        const requesterName =
            request.requesterDoctorName ||
            request.requesterName ||
            "";


        const patientName =
            request.patientName ||
            "";


        const patientId =
            request.patientId ||
            "";


        let message;


        if (
            decision === "accepted"
        ) {

            message =
                currentDoctorName +
                " accepted your access request for " +
                patientName +
                " (" +
                patientId +
                ").";

        } else {

            message =
                currentDoctorName +
                " rejected your access request for " +
                patientName +
                " (" +
                patientId +
                ").";

        }


        notifications.push({

            id:
                "NOTIF-AR-" +
                Date.now(),

            type:
                "Access Request",

            category:
                "Doctor Access",

            recipientRole:
                "Doctor",

            recipientId:
                requesterId,

            recipientName:
                requesterName,

            patientId:
                patientId,

            patientName:
                patientName,

            requestId:
                request.id,

            message:
                message,

            status:
                "Unread",

            createdAt:
                new Date().toISOString()

        });


        saveArray(
            "notifications",
            notifications
        );

    }


    /* =========================================================
       NOTIFICATION BOX
       ========================================================= */

    function updateNotification() {

        if (!currentDoctor) {
            return;
        }


        const requests =
            getRequests();


        const pendingCount =
            requests.filter(
                function(request) {

                    return (
                        isIncomingRequest(
                            request
                        ) &&
                        normalize(
                            request.status
                        ) === "pending"
                    );

                }
            ).length;


        const box =
            document.getElementById(
                "notificationBox"
            );


        if (
            pendingCount > 0
        ) {

            box.classList.remove(
                "hidden"
            );


            box.textContent =
                "You have " +
                pendingCount +
                " pending access request" +
                (
                    pendingCount === 1
                        ? ""
                        : "s"
                ) +
                " waiting for your decision.";

        } else {

            box.classList.add(
                "hidden"
            );

        }

    }


    /* =========================================================
       ATTRIBUTE ESCAPING
       ========================================================= */

    function escapeAttribute(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(
            value
        )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

    }


    /* =========================================================
       LOGOUT
       ========================================================= */

    function logoutDoctor() {

        /*
         * Do NOT clear hospital data.
         * Only remove doctor session.
         */

        localStorage.removeItem(
            "loggedInDoctor"
        );

        localStorage.removeItem(
            "doctorSession"
        );

        localStorage.removeItem(
            "currentDoctor"
        );

    }


    /* =========================================================
       INITIALIZE
       ========================================================= */

    function initializePage() {

        renderRequests();

    }


    initializePage();

</script>
